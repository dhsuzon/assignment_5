<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
</head>

<body class="bg-[#F6F8FA] min-h-screen">

    <nav class="navbar bg-white border-b px-4 lg:px-20 flex flex-col sm:flex-row">
        <div class="flex-1 gap-2">
            <img src="assets/github-logo.png" class="w-8" alt="Aperture">
            <span class="font-semibold text-2xl text-[#1F2937]">GitHub Issues Tracker</span>
        </div>
        <div class="flex-none gap-2 mt-2">
            <input id="search-input" type="text" placeholder="Search issues..."
                class="input input-bordered rounded-[4px]  p-4 w-auto md:w-[300px]" />
            <button id="search-btn" class="btn btn-primary  font-semibold text-base w-[131px] text-white">+ New
                Issue</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 lg:p-10 lg:px-20">

        <div id="tab-container"
            class=" tabs-boxed bg-white mb-8 p-6  mx-auto border flex flex-col sm:flex-row justify-center items-center sm:justify-start">

            <button class="active-btn tab-active rounded-[4px] font-medium text-[#64748B] text-base   py-3 w-[120px]"
                data-status="all">All</button>
            <button class="active-btn rounded-[4px] font-medium text-[#64748B] text-base   py-3 w-[120px] "
                data-status="open">Open</button>
            <button class="active-btn rounded-[4px] font-medium text-[#64748B] text-base  py-3 w-[120px] "
                data-status="closed">Closed</button>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-5 rounded-lg border gap-4">

            <div class="flex gap-2 justify-center items-center">
                <div class=" flex bg-[#ECE4FF] rounded-full w-[50px] h-[50px] justify-center items-center">
                    <img src="assets/Aperture.png" class="w-[32px]">
                </div>
                <div>
                    <p class="font-semibold text-xl text-[#1F2937]"><span id="total-count">0</span> Issues</p>
                    <p class="font-normal text-base  text-[#64748B] hidden md:block">Track and manage your project
                        issues</p>
                </div>
            </div>


            <div class="flex gap-6">
                <div class="flex items-center gap-2">
                    <div class="w-3 border h-3  border-[#00A96E] bg-[#00A96E] rounded-full"></div>
                    <span class="font-medium text-base text-[#1F2937]">OPEN</span>
                </div>
                <div class=" flex items-center gap-2">
                    <div class="w-3 border h-3  border-[#A855F7] bg-[#A855F7] rounded-full"></div>
                    <span class="font-medium text-base text-[#1F2937]">CLOSED</span>
                </div>
            </div>
        </div>

        <div id="loader" class="flex justify-center text-center my-10 hidden">
            <span class="loading loading-spinner loading-lg text-gray-500"></span>
        </div>

        <div id="issue-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        </div>
    </main>
    <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
    <dialog id="my_modal_1" class="modal">
        <div class="modal-box" id="modal_container">
            <div id="modal_content">


            </div>
            <div class="modal-action">
                <form method="dialog">
                    <!-- if there is a button in form, it will close the modal -->
                    <button class="btn btn-primary outline-none">Close</button>
                </form>
            </div>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>


</html>
