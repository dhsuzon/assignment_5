<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
</head>

<body class="bg-[#F6F8FA] min-h-screen">

    <header>
        <nav class="navbar bg-white border-b px-4 lg:px-20 flex flex-col sm:flex-row">
            <div class="flex-1 gap-2">
                <img src="assets/github-logo.png" class="w-8" alt="Aperture">
                <span class="font-semibold text-2xl text-[#1F2937]">GitHub Issues Tracker</span>
            </div>
            <div class="flex-none gap-2 mt-2">
                <input id="search-input" type="text" placeholder="Search issues..."
                    class="input input-bordered rounded-[4px]  p-4 w-auto md:w-[300px]" />
                <button id="search-btn" class="btn btn-primary  font-semibold text-base w-[131px] text-white">+ New
                    Issue</button>
            </div>
        </nav>
    </header>


</body>


</html>
