<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Login - GitHub Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Geist", sans-serif;

        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="card  bg-white shadow-xl p-8 border">
        <div class="text-center"><img src="assets/github-logo.png" class="w-16 mx-auto mb-4" alt="GitHub">
            <h2 class="text-2xl font-semibold text-[#1F2937] mt-6">GitHub Issues Tracker</h2>
            <p class="text-base text-[#64748B] font-normal mt-1 ">Sign in to manage your issues</p>
        </div>
        <div class="mt-6">
            <label for="Username" class="font-medium text-base  text-[#1F2937] block my-2">Username</label>

            <input id="user" type="text" placeholder="Enter Username" class="input input-bordered w-[456px] py-4" /><br>
            <small class="text-primary">Default: admin</small>
        </div>

        <div class="mt-6">
            <label for="password" class="font-medium text-base text-[#1F2937] block my-2">Password</label>
            <input id="pass" type="password" placeholder="Enter Password" class="input input-bordered w-[456px]" /><br>
            <small class="text-primary">Default: admin123</small>
        </div>

        <button onclick="handleLogin()" class="btn btn-primary mt-6 w-full text-white font-semibold text-base">Sign
            In</button>

        <h2 class="text-center my-6">OR</h2>

        <div class="py-6  text-[10px] text-gray-400 text-center bg-gray-50 rounded-lg">
            <p class="text-base font-medium text-[#1F2937]">Usermane: <small class="text-base">admin</small></p>
            <p class="text-base font-medium text-[#1F2937]">Password: <small class="text-base">admin123</small></p>
        </div>
    </div>

    <script>
        function handleLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if (u === 'admin' && p === 'admin123') {
                window.location.href = "home.html";
            } else {
                alert("Wrong info! Use: admin / admin123");
            }
        }
    </script>

</body>

</html>
